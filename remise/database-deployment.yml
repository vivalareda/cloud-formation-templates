apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: 005744789143.dkr.ecr.us-east-1.amazonaws.com/gti778-mariadb:latest
          ports:
            - containerPort: 3360
          env:
            - name: MYSQL_TCP_PORT
              value: "3360"
            - name: MYSQL_ROOT_PASSWORD
              value: "Password123!"
            - name: MYSQL_USER
              value: "test"
            - name: MYSQL_PASSWORD
              value: "Password123!"
            - name: MYSQL_DATABASE
              value: "Pizzas"
            - name: MYSQL_ROOT_HOST
              value: "%"
          resources:
            requests:
              cpu: "2"
              memory: "3Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          livenessProbe:
            tcpSocket:
              port: 3360
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3360
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  labels:
    app: mariadb
spec:
  type: LoadBalancer
  selector:
    app: mariadb
  ports:
    - port: 3360
      targetPort: 3360
