apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-deployment
  labels:
    app: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:latest
          resources:
            requests:
              memory: "3Gi"
              cpu: "2000m"
          ports:
            - containerPort: 3360
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "Password123!"
            - name: MYSQL_USER
              value: "test"
            - name: MYSQL_DATABASE
              value: "Pizzas"
          args:
            - "--port=3360"
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
spec:
  selector:
    app: mariadb
  ports:
    - port: 3360
      targetPort: 3360
  type: LoadBalancer
